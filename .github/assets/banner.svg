    <text x="1084.0" y="160" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="-0.6" fill="#0B1A12">21 000 sats</text>
    <text x="1084.0" y="182" text-anchor="middle" font-size="12" fill="#7A8C81">Expires in 14:52</text>
