<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">BtcPayServer for Android — unofficial app</title>
  <desc id="d">An unofficial, native Android client for BTCPay Server. Not affiliated with the BTCPay Server project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08110C"/>
      <stop offset="1" stop-color="#11271A"/>
    </linearGradient>
    <radialGradient id="glow" cx="1084.0" cy="250" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51B13E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#51B13E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="132" cy="120" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CEDC21" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#CEDC21" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1A12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g clip-path="url(#card)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
    <rect width="1280" height="440" fill="url(#glow2)"/>

    <!-- App icon: the launcher tile -->
    <g filter="url(#lift)">
      <rect x="88" y="76" width="88" height="88" rx="22" fill="#FFFFFF"/>
    </g>
    <g transform="translate(108.62 80.00) scale(0.42447)">
      <g transform="translate(-106.19 -58.85)">
