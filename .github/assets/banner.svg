        <path fill="#CEDC21" d="M128.3,69.91a11.06,11.06,0,1,0-22.11,0V209H128.3Z"/>
      </g>
    </g>

    <!-- Unofficial badge -->
    <rect x="204" y="84" width="196" height="34" rx="17" fill="#CEDC21" fill-opacity="0.12" stroke="#CEDC21" stroke-opacity="0.55"/>
    <text x="302" y="106.5" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2.4" fill="#DDE86A" textLength="156" lengthAdjust="spacingAndGlyphs">UNOFFICIAL APP</text>
    <text x="204" y="152" font-size="19" fill="#8CA597">Not affiliated with the BTCPay Server project</text>

    <!-- Title -->
    <text x="86" y="262" font-size="58" font-weight="800" letter-spacing="-1.2" fill="#FFFFFF">BtcPayServer<tspan font-weight="300" fill="#A7C3B1"> for Android</tspan></text>
    <text x="88" y="312" font-size="25" fill="#B9CBBF">A native, private client for your own BTCPay Server.</text>
    <text x="88" y="370" xml:space="preserve" font-size="19" font-weight="600" letter-spacing="0.4" fill="#7D998A">Terminal<tspan fill="#51B13E">  ·  </tspan>Invoices<tspan fill="#51B13E">  ·  </tspan>On-chain<tspan fill="#51B13E">  ·  </tspan>Lightning<tspan fill="#51B13E">  ·  </tspan>Payouts<tspan fill="#51B13E">  ·  </tspan>Admin</text>

